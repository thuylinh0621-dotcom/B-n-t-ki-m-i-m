<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xử Lý Ảnh</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #f0f0f0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
        }
        h1 {
            color: #333;
        }
        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .image-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }
        .image-card img {
            max-width: 100%;
            max-height: 300px;
            margin-bottom: 10px;
        }
        .image-name {
            font-weight: bold;
            margin-bottom: 10px;
            word-break: break-word;
        }
        .controls {
            margin-top: 10px;
        }
        button {
            padding: 8px 16px;
            margin: 5px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
        }
        .rotate-btn {
            background: #2196F3;
            color: white;
        }
        .save-btn {
            background: #4CAF50;
            color: white;
        }
        .upload-section {
            margin-bottom: 30px;
            padding: 20px;
            border: 2px dashed #aaa;
            border-radius: 10px;
            text-align: center;
        }
        #fileInput {
            display: none;
        }
        .upload-label {
            display: inline-block;
            padding: 15px 30px;
            background: #667eea;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1em;
        }
        .save-all-btn {
            background: #FF9800;
            color: white;
            padding: 15px 40px;
            font-size: 1.2em;
            margin-top: 30px;
        }
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
        }
        .success {
            background: #d4edda;
            color: #155724;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📷 Xử Lý Ảnh Học Sinh</h1>
        
        <div class="upload-section">
            <p>Chọn tất cả ảnh từ thư mục "Danh sách ảnh":</p>
            <label class="upload-label">
                📂 Chọn Tất Cả Ảnh
                <input type="file" id="fileInput" multiple accept="image/*">
            </label>
        </div>
        
        <div id="imageGrid" class="image-grid"></div>
        
        <button class="save-all-btn" onclick="saveAllStudents()">💾 Lưu Tất Cả Vào Ứng Dụng</button>
        
        <div id="status"></div>
    </div>

    <script>
        let processedImages = {};
        let students = [];

        const studentNames = [
            'Dậu Thiên An',
            'Nguyễn Đình Bảo',
            'Nguyễn Sỹ Bảo',
            'Nguyễn Văn Gia Bảo',
            'Nguyễn Hữu Xuân Bắc',
            'Phạm Hải Châu',
            'Lê Quốc Chung',
            'Nguyễn Thị Quỳnh Diệp',
            'Nguyễn Thị Hạnh Dung',
            'Võ Mạnh Dũng',
            'Nguyễn Trần An Đông',
            'Cấn Văn Hiếu',
            'Trần Nguyên Hiếu',
            'Lê Văn Hợp',
            'Nguyễn Xuân Khánh Huy',
            'Doãn Thị Khánh Huyền',
            'Nguyễn Bá Huỳnh',
            'Nguyễn Ngọc Vân Khánh',
            'Trần Hải Khánh',
            'Lê Xuân Kiên',
            'Nguyễn Trần Trung Kiên',
            'Vương Đình Kiên',
            'Nguyễn Khánh Linh',
            'Nguyễn Kiều Linh',
            'Phan Thị Ái Linh',
            'Nguyễn Thị Xuân Mai',
            'Nguyễn Hoàng Mạnh',
            'Trịnh Anh Minh',
            'Nguyễn Thảo My',
            'Phạm Thị Trà My',
            'Hoàng Lê Na',
            'Uông Việt Nhân',
            'Nguyễn Phi Bảo Nhi',
            'Nguyễn Thảo Nhi',
            'Phạm Thị Thục Nhi',
            'Vương Thị Yến Nhi',
            'Nguyễn Thị Tâm',
            'Nguyễn Văn Thành',
            'Nguyễn Minh Thắng',
            'Lê Thùy Trang',
            'Vương Huyền Trang',
            'Lê Văn Trung',
            'Nguyễn Bá Tuấn',
            'Trần Thanh Tuyền',
            'Nguyễn Thị Hà Vy',
            'Nguyễn Minh Hoàn'
        ];

        document.getElementById('fileInput').addEventListener('change', handleFiles);

        function handleFiles(e) {
            const files = Array.from(e.target.files);
            const grid = document.getElementById('imageGrid');
            grid.innerHTML = '';
            processedImages = {};

            files.forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const imageName = file.name.replace(/\.[^/.]+$/, '').replace(/\s*\(\d+\)\s*$/, '').replace(/\s+$/, '').replace(/^\s+/, '');
                    const studentName = findMatchingStudent(imageName);
                    
                    if (studentName) {
                        if (!processedImages[studentName]) {
                            processedImages[studentName] = [];
                        }
                        processedImages[studentName].push({
                            src: event.target.result,
                            rotation: 0,
                            file: file,
                            index: index
                        });
                        
                        addImageCard(studentName, event.target.result, index, processedImages[studentName].length - 1);
                    }
                };
                reader.readAsDataURL(file);
            });
        }

        function findMatchingStudent(imageName) {
            const normalizedImageName = imageName.toLowerCase().replace(/\s+/g, '').replace(/[()]/g, '');
            
            for (const name of studentNames) {
                const normalizedStudentName = name.toLowerCase().replace(/\s+/g, '');
                if (normalizedImageName.includes(normalizedStudentName) || normalizedStudentName.includes(normalizedImageName)) {
                    return name;
                }
            }
            return null;
        }

        function addImageCard(studentName, src, index, imgIndex) {
            const grid = document.getElementById('imageGrid');
            const card = document.createElement('div');
            card.className = 'image-card';
            card.id = `card-${index}`;
            card.innerHTML = `
                <div class="image-name">${studentName} (${imgIndex + 1})</div>
                <img id="img-${index}" src="${src}" style="transform: rotate(0deg);">
                <div class="controls">
                    <button class="rotate-btn" onclick="rotateImage('${studentName}', ${imgIndex}, ${index}, -90)">↶ Xoay trái</button>
                    <button class="rotate-btn" onclick="rotateImage('${studentName}', ${imgIndex}, ${index}, 90)">↷ Xoay phải</button>
                </div>
            `;
            grid.appendChild(card);
        }

        function rotateImage(studentName, imgIndex, index, degrees) {
            const img = document.getElementById(`img-${index}`);
            
            let currentRotation = processedImages[studentName][imgIndex].rotation || 0;
            currentRotation = (currentRotation + degrees) % 360;
            processedImages[studentName][imgIndex].rotation = currentRotation;
            
            img.style.transform = `rotate(${currentRotation}deg)`;
        }

        function fixImageRotation(src, rotation, callback) {
            const img = new Image();
            img.onload = function() {
                let width = img.width;
                let height = img.height;
                
                const maxWidth = 1000;
                if (width > maxWidth) {
                    height = (height * maxWidth) / width;
                    width = maxWidth;
                }
                
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                if (rotation === 90 || rotation === -270) {
                    canvas.width = height;
                    canvas.height = width;
                    ctx.translate(canvas.width, 0);
                    ctx.rotate(90 * Math.PI / 180);
                } else if (rotation === -90 || rotation === 270) {
                    canvas.width = height;
                    canvas.height = width;
                    ctx.translate(0, canvas.height);
                    ctx.rotate(-90 * Math.PI / 180);
                } else if (rotation === 180 || rotation === -180) {
                    canvas.width = width;
                    canvas.height = height;
                    ctx.translate(canvas.width, canvas.height);
                    ctx.rotate(180 * Math.PI / 180);
                } else {
                    canvas.width = width;
                    canvas.height = height;
                }
                
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                callback(canvas.toDataURL('image/jpeg', 0.5));
            };
            img.src = src;
        }

        function saveAllStudents() {
            students = studentNames.map((name, index) => ({
                id: Date.now() + index,
                name: name,
                images: []
            }));
            
            let totalImagesToProcess = 0;
            for (const studentName in processedImages) {
                totalImagesToProcess += processedImages[studentName].length;
            }
            
            let processedCount = 0;
            
            if (totalImagesToProcess === 0) {
                localStorage.setItem('students', JSON.stringify(students));
                const statusDiv = document.getElementById('status');
                statusDiv.className = 'status success';
                statusDiv.innerHTML = `
                    <strong>✅ Thành công!</strong><br>
                    Đã tạo danh sách học sinh (chưa có ảnh).<br>
                    <a href="index.html" style="color: #155724; font-weight: bold;">→ Nhấn vào đây để mở ứng dụng</a>
                `;
                return;
            }
            
            for (const studentName in processedImages) {
                const studentImages = processedImages[studentName];
                studentImages.forEach(imageData => {
                    fixImageRotation(imageData.src, imageData.rotation, (fixedSrc) => {
                        const student = students.find(s => s.name === studentName);
                        if (student) {
                            student.images.push(fixedSrc);
                        }
                        processedCount++;
                        
                        if (processedCount >= totalImagesToProcess) {
                            localStorage.setItem('students', JSON.stringify(students));
                            
                            const statusDiv = document.getElementById('status');
                            statusDiv.className = 'status success';
                            statusDiv.innerHTML = `
                                <strong>✅ Thành công!</strong><br>
                                Đã lưu ${totalImagesToProcess} ảnh vào ứng dụng.<br>
                                <a href="index.html" style="color: #155724; font-weight: bold;">→ Nhấn vào đây để mở ứng dụng</a>
                            `;
                        }
                    });
                });
            }
        }
    </script>
</body>
</html>
